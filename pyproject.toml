[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "shizai-agent"
version = "0.7.27"
description = "Local CLI and MCP bridge for the Shizai Intelligent desktop application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1,<9",
    "cryptography>=48.0.1,<51",
    "mcp>=1.12,<2",
    "psutil>=5.9,<8",
    "requests>=2.31,<3",
    "websocket-client>=1.7,<2",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.15,<1",
]

[project.scripts]
shizai-agent = "shizai_agent.shizai_agent_cli:main"
shizai-agent-mcp = "shizai_agent.core.mcp_server:main"

[tool.setuptools.packages.find]
include = ["shizai_agent", "shizai_agent.*"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
